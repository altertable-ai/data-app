<!doctype html>
<html>
  <head>
    <!-- Author CSS precedes injection to exercise layer precedence in either order. -->
    <style>
      :root[data-override] {
        --at-accent: #123456;
        --at-cursor-action: crosshair;
        --at-space-md: 23px;
      }
      .altertable-button[data-override] {
        background: rgb(12, 34, 56);
      }
      .host-control {
        font: 17px monospace;
      }
    </style>
  </head>
  <body>
    <button class="host-control">Host control</button>
    <div class="altertable-app-layout">
      <button class="altertable-button">Action</button>
      <button class="altertable-button" disabled>Disabled action</button>
      <label class="altertable-checkbox">
        <input type="checkbox" checked />
        <span class="altertable-selection-mark" data-selected></span>
        Selected
        <small>Muted explanation</small>
      </label>
      <label class="altertable-checkbox">
        <input type="checkbox" disabled />
        Disabled checkbox
      </label>
      <button class="altertable-glossary-definition-trigger">Definition</button>
      <button class="altertable-selectable-bars-item">Chart action</button>
      <div class="altertable-tabs">
        <button class="react-aria-Tab" data-focus-visible>Tab</button>
      </div>
      <div class="altertable-metric-widget">Widget</div>
      <div class="altertable-grid" data-columns="1">
        <div>First grid item</div>
        <div>Second grid item</div>
      </div>
      <div class="altertable-selectable-bars-bar">Bar</div>
    </div>
    <div class="altertable-tooltip-content" role="tooltip">
      Portaled tooltip
    </div>
    <div class="altertable-combobox-popover">
      <div class="react-aria-ListBoxItem" role="option" data-disabled>
        Disabled option
      </div>
      <div class="react-aria-ListBoxItem" role="option" data-focus-visible>
        Focused option
      </div>
    </div>
    <div class="host-tabs"><div class="react-aria-Tab">Host tab</div></div>
    <div id="palette"></div>
    <script type="module" src="./appearance.ts"></script>
  </body>
</html>
