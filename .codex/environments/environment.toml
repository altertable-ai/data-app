version = 1
name = "data-app"

[setup]
script = '''
bun install --frozen-lockfile
bash scripts/install-test-browser.sh
bun run build
bun install --frozen-lockfile
'''

[[actions]]
name = "Dev"
icon = "run"
command = "bun run dev"

[[actions]]
name = "Preview gallery"
icon = "run"
command = "bun run dev:gallery"

[[actions]]
name = "Check"
icon = "test"
command = "bun run check"

[[actions]]
name = "Tests"
icon = "test"
command = "bun run build && bun install --frozen-lockfile && bun run test"

[[actions]]
name = "Build"
icon = "test"
command = "bun run build"
