<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Data app</title>
    <style>
      html,
      body,
      #root {
        margin: 0;
        height: 100%;
      }
      #root {
        position: relative;
      }
      .dev-file-frame {
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
      }
      .dev-file-error {
        margin: 0;
        padding: 16px;
        font:
          13px/1.5 ui-monospace,
          monospace;
        white-space: pre-wrap;
        color: #b42318;
        background: #fef3f2;
      }
      .dev-file-runtime-error {
        position: absolute;
        inset: 0 0 auto;
        z-index: 1;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./host.tsx"></script>
  </body>
</html>
