name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub release tag to retry publishing (for example v0.60.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Run Release Please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  context:
    needs: release
    if: >-
      always() && github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' || needs.release.outputs.release_created == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.context.outputs.sha }}
      tag: ${{ steps.context.outputs.tag }}
    env:
      RELEASE_TAG: ${{ inputs.tag || needs.release.outputs.tag_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Resolve release revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Verify release identity
        id: context
        shell: bash
        run: bash scripts/release/context.sh

  verify:
    needs: context
    if: always() && needs.context.result == 'success'
    uses: ./.github/workflows/check.yml
    with:
      ref: ${{ needs.context.outputs.sha }}

  publish:
    needs: [context, verify]
    if: always() && needs.verify.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_TAG: ${{ needs.context.outputs.tag }}
      RELEASE_SHA: ${{ needs.context.outputs.sha }}
    steps:
      - name: Check out verified release revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_SHA }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          # A registry-url would install token auth configuration, preventing npm OIDC.
          package-manager-cache: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Set up npm for trusted publishing
        run: bash scripts/release/setup-npm.sh
      - name: Verify release and trusted publishing
        shell: bash
        run: bash scripts/release/verify.sh
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build package
        run: bun run build
      - name: Publish package
        shell: bash
        run: bash scripts/release/publish.sh
